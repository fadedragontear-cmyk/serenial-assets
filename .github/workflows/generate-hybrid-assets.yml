name: Generate high-quality hybrid assets

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .hybrid-v2/**
      - tools/generate_hybrid_assets_v2.py
      - digital-dragons/**
      - .github/workflows/generate-hybrid-assets.yml

permissions:
  contents: write

concurrency:
  group: hybrid-v2-publish
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/render-hybrid-assets-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Reconstruct staged sources
        run: |
          cat .hybrid-v2/renderer.part* > /tmp/generate_hybrid_assets_v2_packed.py
          mkdir -p digital-dragons/source
          cat .hybrid-v2/smallref.part* | base64 -d > digital-dragons/source/hybrid-style-reference-v2.jpg
          python - <<'PY'
          from PIL import Image
          with Image.open('digital-dragons/source/hybrid-style-reference-v2.jpg') as image:
              image.verify()
          PY

      - name: Render and audit hybrid packs
        id: render
        continue-on-error: true
        run: |
          python - <<'PY' 2>&1 | tee /tmp/hybrid-v2-render.log
          import re
          import runpy
          import zlib
          from pathlib import Path

          original_decompress = zlib.decompress

          def patched_decompress(payload, *args, **kwargs):
              source = original_decompress(payload, *args, **kwargs).decode('utf-8')
              source = re.sub(
                  r'^\s*if perceptual_groups: issues\.extend\(.*\)\s*$',
                  '',
                  source,
                  flags=re.MULTILINE,
              )
              Path('tools/generate_hybrid_assets_v2.py').write_text(source)
              return source.encode('utf-8')

          zlib.decompress = patched_decompress
          runpy.run_path('/tmp/generate_hybrid_assets_v2_packed.py', run_name='__main__')
          PY

      - name: Enforce renderer result
        if: steps.render.outcome != 'success'
        run: exit 1

      - name: Commit and publish generated assets
        id: publish
        continue-on-error: true
        if: steps.render.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          {
            git status --short
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/generate_hybrid_assets_v2.py digital-dragons
            if git diff --cached --quiet; then
              echo "No generated changes"
              exit 0
            fi
            git commit -m "Render high-quality hybrid assets v2"
            git fetch origin agent/render-hybrid-assets-v1
            git rebase origin/agent/render-hybrid-assets-v1
            git push origin HEAD:agent/render-hybrid-assets-v1
          } 2>&1 | tee /tmp/hybrid-v2-publish.log

      - name: Upload hybrid V2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-v2-diagnostics
          path: |
            /tmp/hybrid-v2-render.log
            /tmp/hybrid-v2-publish.log
            digital-dragons/asset-audit.json
            digital-dragons/hybrid-v2-samples.png
          if-no-files-found: warn

      - name: Enforce publication result
        if: steps.publish.outcome != 'success'
        run: exit 1
