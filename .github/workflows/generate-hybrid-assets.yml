name: Generate high-quality hybrid assets

on:
  workflow_dispatch:
  push:
    branches:
      - agent/render-hybrid-assets-v1
    paths:
      - .hybrid-v2/**
      - .github/workflows/generate-hybrid-assets.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/generate_hybrid_assets_v2.py
      - digital-dragons/**
      - .github/workflows/generate-hybrid-assets.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/render-hybrid-assets-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Reconstruct renderer and art reference
        run: |
          cat .hybrid-v2/renderer.part* > tools/generate_hybrid_assets_v2.py
          mkdir -p digital-dragons/source
          cat .hybrid-v2/smallref.part* | base64 -d > digital-dragons/source/hybrid-style-reference-v2.jpg

      - name: Render and audit hybrid packs
        run: python tools/generate_hybrid_assets_v2.py

      - name: Upload hybrid V2 sample sheet
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-v2-samples
          path: digital-dragons/hybrid-v2-samples.png
          if-no-files-found: error

      - name: Commit generated assets and source
        if: github.event_name != 'pull_request'
        run: |
          rm -rf .hybrid-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .hybrid-v2 tools/generate_hybrid_assets_v2.py digital-dragons
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Render high-quality hybrid assets v2"
          git push origin HEAD:agent/render-hybrid-assets-v1
