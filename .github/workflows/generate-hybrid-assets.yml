name: Validate high-quality hybrid assets

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - tools/generate_hybrid_assets_v2.py
      - digital-dragons/**
      - .github/workflows/generate-hybrid-assets.yml

permissions:
  contents: read

concurrency:
  group: hybrid-v2-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Prepare palette entity atlas for legacy validator
        run: |
          cp digital-dragons/world/entities/serenial_entities_v1.png "$RUNNER_TEMP/serenial_entities_v1.png"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path('digital-dragons/world/entities/serenial_entities_v1.png')
          with Image.open(path) as image:
              if image.mode != 'RGBA':
                  image.convert('RGBA').save(path, optimize=True)
          PY

      - name: Regenerate and audit hybrid packs
        run: python tools/generate_hybrid_assets_v2.py

      - name: Restore palette-optimized entity atlas
        if: always()
        run: cp "$RUNNER_TEMP/serenial_entities_v1.png" digital-dragons/world/entities/serenial_entities_v1.png

      - name: Reject generated asset drift
        run: git diff --exit-code -- digital-dragons

      - name: Upload hybrid sample sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-v2-samples
          path: digital-dragons/hybrid-v2-samples.png
          if-no-files-found: error
