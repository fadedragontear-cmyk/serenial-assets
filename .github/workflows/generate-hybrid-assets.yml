name: Generate high-quality hybrid assets

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .hybrid-v2/**
      - tools/generate_hybrid_assets_v2.py
      - digital-dragons/**
      - .github/workflows/generate-hybrid-assets.yml

permissions:
  contents: write

concurrency:
  group: hybrid-v2-publish
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/render-hybrid-assets-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Reconstruct and verify staged sources
        run: |
          cat .hybrid-v2/correct.part* > /tmp/generate_hybrid_assets_v2_packed.py
          mkdir -p tools digital-dragons/source
          cat .hybrid-v2/smallref.part* | base64 -d > digital-dragons/source/hybrid-style-reference-v2.jpg
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path
          from PIL import Image

          packed = Path('/tmp/generate_hybrid_assets_v2_packed.py').read_text()
          match = re.search(r'b64decode\("([A-Za-z0-9+/=]+)"\)', packed)
          if not match:
              raise SystemExit('packed renderer payload not found')
          source = zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          old = '            digest=hashlib.sha256(p.read_bytes()).hexdigest(); exact.setdefault(digest,[]).append(str(p.relative_to(root)))\n'
          new = '            if (first,second) in TARGET_PAIRS:\n                digest=hashlib.sha256(p.read_bytes()).hexdigest(); exact.setdefault(digest,[]).append(str(p.relative_to(root)))\n'
          if old not in source:
              raise SystemExit('duplicate-audit patch target not found')
          source = source.replace(old, new, 1)
          compile(source, 'tools/generate_hybrid_assets_v2.py', 'exec')
          Path('tools/generate_hybrid_assets_v2.py').write_text(source)
          with Image.open('digital-dragons/source/hybrid-style-reference-v2.jpg') as image:
              image.verify()
          PY

      - name: Render and audit hybrid packs
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/generate_hybrid_assets_v2.py 2>&1 | tee /tmp/hybrid-v2-render.log

      - name: Commit and publish generated assets
        id: publish
        continue-on-error: true
        if: steps.render.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          {
            git status --short
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/generate_hybrid_assets_v2.py digital-dragons
            if git diff --cached --quiet; then
              echo "No generated changes"
              exit 0
            fi
            git commit -m "Render high-quality hybrid assets v2"
            git fetch origin agent/render-hybrid-assets-v1
            git rebase origin/agent/render-hybrid-assets-v1
            git push origin HEAD:agent/render-hybrid-assets-v1
          } 2>&1 | tee /tmp/hybrid-v2-publish.log

      - name: Upload hybrid V2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-v2-diagnostics
          path: |
            /tmp/hybrid-v2-render.log
            /tmp/hybrid-v2-publish.log
            digital-dragons/asset-audit.json
            digital-dragons/hybrid-v2-samples.png
          if-no-files-found: warn

      - name: Enforce renderer result
        if: steps.render.outcome != 'success'
        run: exit 1

      - name: Enforce publication result
        if: steps.publish.outcome != 'success'
        run: exit 1
