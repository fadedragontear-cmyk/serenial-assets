name: Validate high-quality hybrid assets

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - tools/generate_hybrid_assets_v2.py
      - digital-dragons/**
      - .github/workflows/generate-hybrid-assets.yml

permissions:
  contents: read

concurrency:
  group: hybrid-v2-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Preserve current manifest version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('digital-dragons/manifest.json').read_text(encoding='utf-8'))
          version = str(manifest.get('asset_version') or '').strip()
          if not version:
              raise SystemExit('digital-dragons/manifest.json is missing asset_version')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'SERENIAL_MANIFEST_VERSION={version}\n')
          print(f'Preserving manifest asset_version {version}')
          PY

      - name: Prepare palette entity atlas for legacy validator
        run: |
          cp digital-dragons/world/entities/serenial_entities_v1.png "$RUNNER_TEMP/serenial_entities_v1.png"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path('digital-dragons/world/entities/serenial_entities_v1.png')
          with Image.open(path) as image:
              if image.mode != 'RGBA':
                  image.convert('RGBA').save(path, optimize=True)
          PY

      - name: Regenerate and audit hybrid packs
        run: python tools/generate_hybrid_assets_v2.py

      - name: Restore current manifest version
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('digital-dragons/manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest['asset_version'] = os.environ['SERENIAL_MANIFEST_VERSION']
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Restore palette-optimized entity atlas
        if: always()
        run: cp "$RUNNER_TEMP/serenial_entities_v1.png" digital-dragons/world/entities/serenial_entities_v1.png

      - name: Reject generated asset drift
        run: git diff --exit-code -- digital-dragons

      - name: Upload hybrid sample sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-v2-samples
          path: digital-dragons/hybrid-v2-samples.png
          if-no-files-found: error
