name: Generate hybrid assets

on:
  workflow_dispatch:
  push:
    branches:
      - agent/render-hybrid-assets-v1
    paths:
      - tools/generate_hybrid_assets.py
      - .github/workflows/generate-hybrid-assets.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/render-hybrid-assets-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Render and audit hybrid packs
        run: python tools/generate_hybrid_assets.py

      - name: Commit generated assets
        run: |
          if git diff --quiet -- digital-dragons; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital-dragons
          git commit -m "Render pair-specific hybrid assets v1"
          git push origin HEAD:agent/render-hybrid-assets-v1
