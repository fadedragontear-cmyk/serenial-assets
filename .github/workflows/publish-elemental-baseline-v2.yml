name: Publish elemental hatchling baseline

on:
  push:
    branches:
      - agent/elemental-hatchling-baseline-v1
    paths:
      - '.asset-publish/**'
      - '.github/workflows/publish-elemental-baseline-v2.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.asset-publish/**'
      - '.github/workflows/publish-elemental-baseline-v2.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/elemental-hatchling-baseline-v1
          fetch-depth: 0

      - name: Select validated compact payload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.asset-publish/publish_elemental_baseline.py')
          body = path.read_text()
          old = 'hatchling_compact20_pack.b64.part*'
          new = 'hatchling_compact20_pack.correct.part*'
          if old not in body:
              raise SystemExit('expected compact payload pattern not found')
          path.write_text(body.replace(old, new))
          PY

      - name: Build and validate runtime assets
        run: python .asset-publish/publish_elemental_baseline.py

      - name: Remove publication payload
        run: |
          rm -rf .asset-publish
          rm -f .github/workflows/publish-elemental-baseline-v2.yml

      - name: Commit generated baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish all elemental hatchling baseline assets"
          git push origin HEAD:agent/elemental-hatchling-baseline-v1
