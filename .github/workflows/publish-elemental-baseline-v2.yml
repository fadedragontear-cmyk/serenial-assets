name: Publish elemental hatchling baseline

on:
  push:
    branches:
      - agent/elemental-hatchling-baseline-v1
    paths:
      - '.asset-publish/**'
      - '.github/workflows/publish-elemental-baseline-v2.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.asset-publish/**'
      - '.github/workflows/publish-elemental-baseline-v2.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/elemental-hatchling-baseline-v1
          fetch-depth: 0

      - name: Assemble validated compact payload
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.asset-publish')
          pieces = [root / f'hatchling_compact20_pack.correct.part{i:02d}' for i in range(10)]
          pieces += [root / f'hatchling_compact20_pack.correct.part10frag{i:02d}' for i in range(8)]
          pieces += [root / 'hatchling_compact20_pack.correct.part11']
          missing = [str(path) for path in pieces if not path.exists()]
          if missing:
              raise SystemExit(f'missing compact payload pieces: {missing}')
          assembled = ''.join(path.read_text().strip() for path in pieces)
          if len(assembled) != 92808:
              raise SystemExit(f'unexpected assembled payload length: {len(assembled)}')
          (root / 'hatchling_compact20_pack.assembled.b64').write_text(assembled)

          publisher = root / 'publish_elemental_baseline.py'
          body = publisher.read_text()
          old = 'hatchling_compact20_pack.b64.part*'
          new = 'hatchling_compact20_pack.assembled.b64'
          if old not in body:
              raise SystemExit('expected compact payload pattern not found')
          publisher.write_text(body.replace(old, new))
          PY

      - name: Build and validate runtime assets
        run: python .asset-publish/publish_elemental_baseline.py

      - name: Remove publication payload
        run: |
          rm -rf .asset-publish
          rm -f .github/workflows/publish-elemental-baseline-v2.yml

      - name: Commit generated baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish all elemental hatchling baseline assets"
          git push origin HEAD:agent/elemental-hatchling-baseline-v1
