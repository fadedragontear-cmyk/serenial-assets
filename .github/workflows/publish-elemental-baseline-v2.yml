name: Publish elemental hatchling baseline

on:
  push:
    branches:
      - agent/elemental-hatchling-baseline-v1
    paths:
      - '.asset-publish/**'
      - '.github/workflows/publish-elemental-baseline-v2.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.asset-publish/**'
      - '.github/workflows/publish-elemental-baseline-v2.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/elemental-hatchling-baseline-v1
          fetch-depth: 0

      - name: Inspect staged payload chunks
        run: |
          python - <<'PY'
          from pathlib import Path
          for pattern in ('hatchling_compact20_pack.b64.part*', 'hatchling_palette_pack.b64.part*'):
              print('PATTERN', pattern)
              for path in sorted(Path('.asset-publish').glob(pattern)):
                  body = path.read_text()
                  compact = ''.join(body.split())
                  print(path.name, 'raw=', len(body), 'compact=', len(compact), 'mod4=', len(compact) % 4, 'padding=', compact.count('='))
                  print(' first=', repr(compact[:32]), 'last=', repr(compact[-64:]))
          PY

      - name: Decode independently encoded payload chunks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.asset-publish/publish_elemental_baseline.py')
          body = path.read_text()
          old = 'packed = base64.b64decode("".join(part.read_text().strip() for part in parts), validate=True)'
          new = 'packed = b"".join(base64.b64decode(part.read_text().strip(), validate=True) for part in parts)'
          if old not in body:
              raise SystemExit('expected chunk decoder line not found')
          path.write_text(body.replace(old, new))
          PY

      - name: Build and validate runtime assets
        run: python .asset-publish/publish_elemental_baseline.py

      - name: Remove publication payload
        run: |
          rm -rf .asset-publish
          rm -f .github/workflows/publish-elemental-baseline-v2.yml

      - name: Commit generated baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish all elemental hatchling baseline assets"
          git push origin HEAD:agent/elemental-hatchling-baseline-v1
