name: Build hatchling idle review sheet

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - tools/build_hatchling_review_sheet.py
      - digital-dragons/dragons/elemental/**/hatchling_01/sprites_v2/idle.png
      - .github/workflows/build-hatchling-review-sheet.yml

permissions:
  contents: read

jobs:
  review-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Build hatchling idle review sheet
        run: python tools/build_hatchling_review_sheet.py

      - name: Upload review sheet
        uses: actions/upload-artifact@v4
        with:
          name: hatchling-idle-review-sheet
          path: hatchling-idle-review-sheet.png
          if-no-files-found: error
