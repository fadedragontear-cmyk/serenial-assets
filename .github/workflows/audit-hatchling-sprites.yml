name: Audit hatchling sprite packs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - tools/audit_hatchling_sprites.py
      - digital-dragons/dragons/elemental/**/hatchling_01/**
      - .github/workflows/audit-hatchling-sprites.yml

permissions:
  contents: read

concurrency:
  group: hatchling-sprite-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image audit dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Audit elemental hatchling sprite packs
        run: python tools/audit_hatchling_sprites.py --json hatchling-audit.json

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatchling-sprite-audit
          path: hatchling-audit.json
          if-no-files-found: error
