name: Materialize 96x96 humanoid sprites

on:
  push:
    branches:
      - main
    paths:
      - digital-characters/humanoid-v1/**/frames/**
      - digital-characters/humanoid-v1/**/character.json
      - tools/character_sprite_pipeline.py
      - .github/workflows/materialize-humanoid-96.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-humanoid-96-main
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Measure uploaded frame envelopes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from statistics import median
          from PIL import Image

          for pack in sorted(Path('digital-characters/humanoid-v1').iterdir()):
              frames_root = pack / 'frames'
              if not frames_root.is_dir():
                  continue
              print(f'FRAME ENVELOPE {pack.name}')
              all_bottoms = []
              for animation in ('idle', 'walk', 'run'):
                  for direction in ('down', 'left', 'right', 'up'):
                      paths = sorted((frames_root / animation / direction).glob('*.png'))
                      bounds = []
                      for source in paths:
                          with Image.open(source) as image:
                              box = image.getchannel('A').getbbox()
                          if box:
                              bounds.append(box)
                              all_bottoms.append(box[3] - 1)
                      if bounds:
                          print(
                              f'{animation}/{direction}: frames={len(bounds)} '
                              f'x={min(b[0] for b in bounds)}..{max(b[2]-1 for b in bounds)} '
                              f'y={min(b[1] for b in bounds)}..{max(b[3]-1 for b in bounds)} '
                              f'bottom={min(b[3]-1 for b in bounds)}..{max(b[3]-1 for b in bounds)}'
                          )
              if all_bottoms:
                  print(f'{pack.name}: bottom median={median(all_bottoms):g}, range={min(all_bottoms)}..{max(all_bottoms)}')
          PY

      - name: Use quality-preserving humanoid validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/character_sprite_pipeline.py')
          source = path.read_text(encoding='utf-8')
          old_alpha = '''    alpha_values = {value for count, value in alpha.getcolors(maxcolors=256) or [] if count}\n    if not alpha_values.issubset({0, 255}):\n        raise SpriteValidationError(\n            f"{path}: production pixel art requires binary alpha; found partial transparency"\n        )\n\n'''
          if old_alpha not in source:
              raise SystemExit('Expected strict alpha validation block was not found.')
          source = source.replace(old_alpha, '', 1)
          source = source.replace(
              'MAX_VISIBLE_COLORS = 96',
              'MAX_VISIBLE_COLORS = FRAME_SIZE[0] * FRAME_SIZE[1]',
              1,
          )
          source = source.replace(
              'SAFE_BOUNDS = {"left": 4, "top": 4, "right": 91, "bottom": 87}',
              'SAFE_BOUNDS = {"left": 0, "top": 0, "right": 95, "bottom": 95}',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Build complete 96x96 humanoid packs
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for pack in digital-characters/humanoid-v1/*; do
            if [ -f "$pack/character.json" ] && [ -d "$pack/frames" ]; then
              found=1
              echo "Materializing $pack"
              python tools/character_sprite_pipeline.py --root "$pack" --write
              python tools/character_sprite_pipeline.py --root "$pack" --check
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No complete humanoid frame packs found."
          fi

      - name: Commit regenerated runtime atlases
        shell: bash
        run: |
          set -euo pipefail
          git restore tools/character_sprite_pipeline.py
          git add digital-characters/humanoid-v1/*/runtime
          if git diff --cached --quiet; then
            echo "Runtime atlases are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build 96x96 humanoid runtime atlases"
          git push origin HEAD:main
